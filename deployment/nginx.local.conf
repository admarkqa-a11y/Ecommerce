# Local HTTP only. Use separate TLS domains and reviewed proxy headers for production.
server {
    listen 80;
    client_max_body_size 11m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { proxy_pass http://storefront:3000; proxy_set_header Host $http_host; }
}
