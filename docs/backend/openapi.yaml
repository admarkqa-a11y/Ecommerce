          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        name_ar:
          type: string
          maxLength: 120
        zone:
          type: string
          format: uuid
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
      - zone
    AttributeOptionResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 150
        label_ar:
          type: string
          maxLength: 150
        attribute:
          type: string
          format: uuid
      required:
      - attribute
      - code
      - created_at
      - id
      - label
      - updated_at
    AttributeResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
