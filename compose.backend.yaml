name: ${COMPOSE_PROJECT_NAME:-retail_backend}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a client environment first}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [queue:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  migrate:
    image: retail-api:${RETAIL_RELEASE:-0.3.0-backend}
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: ${CLIENT_ENV_FILE:?Set CLIENT_ENV_FILE to the generated client environment}
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py bootstrap']
    depends_on:
      db: {condition: service_healthy}
  api:
    image: retail-api:${RETAIL_RELEASE:-0.3.0-backend}
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: ${CLIENT_ENV_FILE:?Set CLIENT_ENV_FILE}
    ports: ['127.0.0.1:${BACKEND_PORT:-8000}:8000']
    volumes: [media:/app/backend/media]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    image: retail-api:${RETAIL_RELEASE:-0.3.0-backend}
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: ${CLIENT_ENV_FILE:?Set CLIENT_ENV_FILE}
    command: [celery, -A, config, worker, --loglevel=info]
    volumes: [media:/app/backend/media]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    image: retail-api:${RETAIL_RELEASE:-0.3.0-backend}
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: ${CLIENT_ENV_FILE:?Set CLIENT_ENV_FILE}
    command: [celery, -A, config, beat, --loglevel=info, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  database:
  queue:
  media:
