name: ${COMPOSE_PROJECT_NAME:-retail_local}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [queue:/data]
  migrate:
    image: retail-api:${RETAIL_RELEASE:-0.4.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${CLIENT_ENV_FILE:-.env}
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py bootstrap']
    depends_on:
      db: {condition: service_healthy}
  api:
    image: retail-api:${RETAIL_RELEASE:-0.4.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${CLIENT_ENV_FILE:-.env}
    volumes: [media:/app/backend/media]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  worker:
    image: retail-api:${RETAIL_RELEASE:-0.4.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${CLIENT_ENV_FILE:-.env}
    command: [celery, -A, config, worker, --loglevel=info]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  scheduler:
    image: retail-api:${RETAIL_RELEASE:-0.4.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${CLIENT_ENV_FILE:-.env}
    command: [celery, -A, config, beat, --loglevel=info, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  storefront:
    image: retail-storefront:${RETAIL_RELEASE:-0.4.0}
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
      args: {APP: storefront}
    environment: {API_ORIGIN: 'http://api:8000', PORT: '3000', INDEXABLE: 'false'}
    depends_on: [api]
  admin:
    image: retail-admin:${RETAIL_RELEASE:-0.4.0}
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
      args: {APP: admin}
    environment: {API_ORIGIN: 'http://api:8000', PORT: '3000'}
    depends_on: [api]
  proxy:
    image: nginx:1.28-alpine
    ports: ['${STOREFRONT_PORT:-8080}:80', '${ADMIN_PORT:-8081}:81']
    volumes: ['./deployment/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [storefront,admin,api]
volumes:
  database:
  media:
  queue:

